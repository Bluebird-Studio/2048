name: Flutter checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - name: Upload installable Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: 2048-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Build browser version
        run: flutter build web --release --base-href /2048/
      - name: Upload browser build
        uses: actions/upload-artifact@v4
        with:
          name: 2048-web-static
          path: build/web
          if-no-files-found: error
          retention-days: 7
